<!-- ═══════════════════ PARAMÈTRES ═══════════════════ -->
<div id="tab-settings" class="tab-content">

  <div class="sec-head"><div class="sec-label">// changer le mot de passe</div></div>
  <div class="settings-card">
    <div class="modal-fields">
      <div class="form-field">
        <label>Mot de passe actuel</label>
        <input type="password" id="pw-current" placeholder="••••••••" />
      </div>
      <div class="form-field">
        <label>Nouveau mot de passe</label>
        <input type="password" id="pw-new" placeholder="min. 8 caractères" />
      </div>
      <div class="form-field">
        <label>Confirmer</label>
        <input type="password" id="pw-confirm" placeholder="••••••••" />
      </div>
    </div>
    <button class="btn-primary" id="pw-btn" onclick="changePassword()">
      <i class="fa-solid fa-key" id="pw-ico"></i> Changer le mot de passe
    </button>
  </div>

  <div class="sec-head" style="margin-top:36px;">
    <div class="sec-label">// utilisateurs panel</div>
    <button class="btn-add" onclick="openModal('user-add')"><i class="fa-solid fa-plus"></i> Ajouter</button>
  </div>
  <div class="settings-card" style="padding:0;overflow:hidden;">
    <table class="users-table">
      <thead><tr><th>Utilisateur</th><th>Rôle</th><th></th></tr></thead>
      <tbody id="users-tbody"><tr><td colspan="3" class="tbl-empty">Chargement...</td></tr></tbody>
    </table>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:36px;">
    <div>
      <div class="sec-head"><div class="sec-label">// infos système</div></div>
      <div class="settings-card">
        <table style="font-size:.75rem;width:100%;border-collapse:collapse;">
          <tbody>
            <tr><td style="color:var(--text-muted);width:140px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">Application</td><td class="mono" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">NXSlab Backup WebUI</td></tr>
            <tr><td style="color:var(--text-muted);padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">Version</td><td class="mono" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);" id="info-version">—</td></tr>
            <tr><td style="color:var(--text-muted);padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">Uptime app</td><td class="mono" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);" id="info-uptime">—</td></tr>
            <tr><td style="color:var(--text-muted);padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">Données</td><td class="mono" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);" id="info-datadir">—</td></tr>
            <tr><td style="color:var(--text-muted);padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">Hôte</td><td class="mono" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);" id="info-hostname">—</td></tr>
            <tr><td style="color:var(--text-muted);padding:8px 0;">Health</td><td class="mono" style="padding:8px 0;"><a href="/health" target="_blank" style="color:var(--accent);">/health</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div>
      <div class="sec-head"><div class="sec-label">// capacités</div></div>
      <div class="settings-card">
        <table style="font-size:.75rem;width:100%;border-collapse:collapse;">
          <tbody>
            <tr><td style="color:var(--text-muted);width:140px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">SSH (Paramiko)</td><td id="cap-paramiko" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">—</td></tr>
            <tr><td style="color:var(--text-muted);padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">Planification</td><td id="cap-scheduler" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">—</td></tr>
            <tr><td style="color:var(--text-muted);padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">Terminal WS</td><td id="cap-websocket" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">—</td></tr>
            <tr><td style="color:var(--text-muted);padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">Samba</td><td id="cap-samba" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">—</td></tr>
            <tr><td style="color:var(--text-muted);padding:8px 0;">FTP</td><td id="cap-ftp" style="padding:8px 0;">—</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="sec-head" style="margin-top:36px;"><div class="sec-label">// session</div></div>
  <div class="settings-card">
    <table style="font-size:.75rem;width:100%;border-collapse:collapse;">
      <tbody>
        <tr><td style="color:var(--text-muted);width:140px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">Connecté en tant que</td><td class="mono" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);" id="info-me-user">—</td></tr>
        <tr><td style="color:var(--text-muted);padding:8px 0;">Rôle</td><td class="mono" style="padding:8px 0;" id="info-me-role">—</td></tr>
      </tbody>
    </table>
    <div style="margin-top:16px;">
      <a href="/logout" class="btn-cancel" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;">
        <i class="fa-solid fa-right-from-bracket"></i> Déconnexion
      </a>
    </div>
  </div>
</div>
